name = "verified-id"
version = "0.1.0"
defaultTargets = ["Rules"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
doc.verso = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# The model: shared concepts in Rules/Core, the One ID rules in Rules/OneId.
[[lean_lib]]
name = "Rules"

# Computes every status from the compiled model (Status/Main.lean).
[[lean_exe]]
name = "status"
root = "Status.Main"
supportInterpreter = true

# The review document, written in Verso.
[[lean_lib]]
name = "Review"
srcDir = "Review"
roots = ["Review"]

[[lean_exe]]
name = "review-doc"
srcDir = "Review"
root = "Main"
# It loads the document's modules when it runs; see Review/Main.lean.
supportInterpreter = true

# The credential checks behind a JSON interface, for checking implementations
# in other languages.  The library holds the handler; the executable loads it
# into Lean's interpreter (see Oracle/Main.lean).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle.Handle"]

[[lean_exe]]
name = "oracle"
root = "Oracle.Main"
supportInterpreter = true

# The data a product site reads: scenarios, readings and the model's decision
# for each, evaluated by the model's functions.  The executable loads the
# library into Lean's interpreter (see Exports/Main.lean) and writes
# build/one-id-data/.  The names are outside Rules, so the status counts and
# the specs do not include them.
[[lean_lib]]
name = "Exports"
roots = ["Exports.Scenarios", "Exports.Readings", "Exports.Decisions"]

[[lean_exe]]
name = "oneid-facts"
root = "Exports.Main"
supportInterpreter = true
